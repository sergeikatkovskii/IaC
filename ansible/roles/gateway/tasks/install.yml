---
- name: Verify the Envoy Gateway chart
  ansible.builtin.include_role:
    name: chart
  vars:
    chart_ref: "{{ gateway_chart }}"
    chart_version: "{{ gateway_version }}"
    chart_sha256: "{{ gateway_chart_sha256 }}"

- name: Install Envoy Gateway, with the Gateway API CRDs it ships
  kubernetes.core.helm:
    name: eg
    chart_ref: "{{ chart_path }}"
    release_namespace: "{{ gateway_namespace }}"
    create_namespace: true
    kube_context: "{{ kube_context }}"
    wait: true
    wait_timeout: 10m
