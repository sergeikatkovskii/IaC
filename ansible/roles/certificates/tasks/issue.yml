---
# On a fresh cluster a dry run cannot show these objects: their resource types arrive
# with the chart installed just before, which a dry run does not install. The first
# apply creates the types; every dry run after that shows the whole diff.
- name: Look for the certificates resource types
  kubernetes.core.k8s_info:
    context: "{{ kube_context }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: clusterissuers.cert-manager.io
  register: certificates_types

- name: Say why this dry run stops here
  ansible.builtin.debug:
    msg: The certificates resource types do not exist yet, so a dry run cannot show these objects. Apply once, then --check --diff shows them.
  when: ansible_check_mode and certificates_types.resources | length == 0

# One object per apply, so --check --diff shows each object's own diff.
- name: Apply the issuer and the public certificate
  kubernetes.core.k8s:
    context: "{{ kube_context }}"
    state: present
    apply: true
    definition: "{{ item }}"
  loop: "{{ lookup('ansible.builtin.template', 'public-certificate.yaml.j2') | ansible.builtin.from_yaml_all | select | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  when: not (ansible_check_mode and certificates_types.resources | length == 0)

- name: Wait for the public certificate
  kubernetes.core.k8s_info:
    context: "{{ kube_context }}"
    api_version: cert-manager.io/v1
    kind: Certificate
    name: katachi-public
    namespace: "{{ edge_namespace }}"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 600
  when: not ansible_check_mode
