---
- name: Verify the cert-manager chart
  ansible.builtin.include_role:
    name: chart
  vars:
    chart_ref: "{{ certificates_chart }}"
    chart_version: "{{ certificates_version }}"
    chart_sha256: "{{ certificates_chart_sha256 }}"

# After Envoy Gateway: cert-manager reads the Gateway API only if its CRDs exist
# when it starts.
- name: Install cert-manager, with its CRDs and the Gateway API solver
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: "{{ chart_path }}"
    release_namespace: "{{ certificates_namespace }}"
    create_namespace: true
    kube_context: "{{ kube_context }}"
    wait: true
    wait_timeout: 10m
    values:
      crds:
        enabled: true
        keep: true
      config:
        apiVersion: controller.config.cert-manager.io/v1alpha1
        kind: ControllerConfiguration
        gatewayAPI:
          enabled: true
