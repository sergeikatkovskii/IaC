# staging. Every REPLACE is refused before anything is applied (platform.yml's first
# task), because a placeholder that runs is how one reaches a real cluster.
platform_environment: staging

# `az aks get-credentials` names the context after the cluster (Terraform's
# cluster_name output).
kube_context: katachi-staging-aks

# KAT-648 §8 Q2 (answered 2026-11-06): the addresses, the same values as
# envs/staging/terraform.tfvars's app_host, mcp_host and admin_host.
app_host: staging.katachi.io
mcp_host: mcp.staging.katachi.io
admin_host: admin.staging.katachi.io

# Let's Encrypt, answered over HTTP on the gateway itself (cert-manager's Gateway API
# solver). The address it mails about expiring certificates:
public_issuer: letsencrypt
acme_email: REPLACE-acme-contact-email

# The static address Terraform made for the gateway (outputs gateway_ip_name and
# gateway_ip_resource_group). Envoy keeps the client's own address
# (externalTrafficPolicy Local), so each per-IP cap is per IP (KAT-S9).
gateway_service_type: LoadBalancer
gateway_ip_name: REPLACE-terraform-output-gateway_ip_name
gateway_ip_resource_group: REPLACE-terraform-output-gateway_ip_resource_group
envoy_replicas: 2
