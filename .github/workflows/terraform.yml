# KAT-648 T-005 — this repository's checks. They format, validate and test with a
# mocked provider, and never apply: a person runs `terraform apply` after reading
# the plan and its price (KAT-648 FR10, ARD-059 §8). No cloud credential exists here.
name: terraform

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: "1"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      # Every Action is pinned by its commit SHA, the tag only as a comment (ARD-059 §2).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -recursive -check

      - name: Validate and test every module and root, from the committed locks
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for dir in modules/* envs/*; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate
            if [ -d "$dir/tests" ]; then
              terraform -chdir="$dir" test
            fi
            echo "::endgroup::"
          done

      - name: Script tests
        run: python3 -m unittest discover -s scripts/tests -v
